name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r cli/requirements.txt
      - run: python -m unittest discover -s cli -v
